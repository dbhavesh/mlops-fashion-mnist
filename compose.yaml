name: mlops-fashion-mnist

services:
  minio:
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
      args:
        MINIO_VERSION: "${MINIO_VERSION:-RELEASE.2025-09-07T16-13-09Z}"
    image: mlops-fashion-mnist-minio:local
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:?Export MINIO_ACCESS_KEY before running Compose}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:?Export MINIO_SECRET_KEY before running Compose}"
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - mlops

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    image: mlops-fashion-mnist-mlflow:local
    ports:
      - "127.0.0.1:${MLFLOW_HOST_PORT:-15000}:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3).read()"
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 240s
    networks:
      - mlops

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: mlops-fashion-mnist-api:local
    environment:
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_SECURE: "false"
      MINIO_BUCKET: "fashion-minst-bucket"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:?Export MINIO_ACCESS_KEY before running Compose}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?Export MINIO_SECRET_KEY before running Compose}"
      MODEL_OBJECT_KEY: "${MODEL_OBJECT_KEY:-}"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-18000}:8000"
    depends_on:
      minio:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 5s
    networks:
      - mlops

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    image: mlops-fashion-mnist-ui:local
    environment:
      FASTAPI_BASE_URL: "http://api:8000"
    ports:
      - "127.0.0.1:${UI_HOST_PORT:-18501}:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()"
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 10s
    networks:
      - mlops

  training:
    profiles: ["training"]
    build:
      context: .
      dockerfile: docker/training.Dockerfile
    image: mlops-fashion-mnist-training:local
    restart: "no"
    environment:
      FASHION_MNIST_PROJECT_ROOT: "/app"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      MLFLOW_EXPERIMENT_NAME: "${MLFLOW_EXPERIMENT_NAME:-fashion-mnist-classifier}"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_SECURE: "false"
      MINIO_BUCKET: "fashion-minst-bucket"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:?Export MINIO_ACCESS_KEY before running Compose}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?Export MINIO_SECRET_KEY before running Compose}"
      WEBHOOK_URL: "${WEBHOOK_URL:-}"
      WEBHOOK_TIMEOUT_SECONDS: "${WEBHOOK_TIMEOUT_SECONDS:-5}"
    depends_on:
      minio:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        python scripts/provision_minio_bucket.py
        exec python -m fashion_mnist_mlops.train \
          --project-root /app \
          --download-data \
          --track-mlflow \
          --upload-minio
    networks:
      - mlops

networks:
  mlops:
    name: mlops-fashion-mnist-network

volumes:
  minio-data:
    name: mlops-fashion-mnist-minio-data
  mlflow-data:
    name: mlops-fashion-mnist-mlflow-data
